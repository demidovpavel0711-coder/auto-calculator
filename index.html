<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Калькулятор растаможки</title>

<style>
*{
    box-sizing:border-box;
}

body{
    background:#111827;
    color:white;
    font-family:Arial,sans-serif;
    max-width:600px;
    margin:auto;
    padding:20px;
    overflow-x:hidden;
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:20px;
}

input{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-size:18px;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    color:white;
}

.calc-btn{
    background:#2563eb;
}

.copy-btn{
    background:#16a34a;
}

#result{
    margin-top:20px;
    background:#1f2937;
    padding:15px;
    border-radius:10px;
    white-space:pre-line;
    font-size:16px;
}
</style>

</head>

<body>

<div class="logo">
    <img src="logo.jpg" alt="logo">
</div>

<input
id="price"
type="tel"
placeholder="Цена авто под ключ (₸)"
oninput="formatInput(this)"

>

<input
id="logistics"
type="tel"
placeholder="Логистика (₸)"
oninput="formatInput(this)"

>

<input
id="engine"
type="number"
placeholder="Объем двигателя (см³)"

>

<input
id="year"
type="number"
placeholder="Год выпуска"

>

<button class="calc-btn" onclick="calculate()">
РАССЧИТАТЬ
</button>

<button class="copy-btn" onclick="copyResult()">
📋 СКОПИРОВАТЬ РАСЧЕТ
</button>

<div id="result"></div>

<script>

function formatInput(input){
    let value = input.value.replace(/\D/g,'');
    input.value = value.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
}

function money(value){
    return Math.round(value).toLocaleString('ru-RU');
}

function calculate(){

    let total_price = Number(
        document.getElementById("price").value.replace(/\s/g,"")
    );

    let logistics = Number(
        document.getElementById("logistics").value.replace(/\s/g,"")
    );

    let engine = Number(
        document.getElementById("engine").value
    );

    let year = Number(
        document.getElementById("year").value
    );

    if(!total_price || !logistics || !engine || !year){
        alert("Заполните все поля");
        return;
    }

    let currentYear = new Date().getFullYear();

    let age = currentYear - year;

    let util;

    if(engine <= 1000)
        util = 324375;
    else if(engine <= 2000)
        util = 756875;
    else if(engine <= 3000)
        util = 1081250;
    else
        util = 2486875;

    let primary;

    if(age < 2)
        primary = 1081;
    else if(age <= 3)
        primary = 216250;
    else
        primary = 2162500;

    let net = total_price - logistics - util - primary;

    let customs = (net / 115) * 15;

    let car_price = net - customs;

    let customs_total = customs + util;

    let total = car_price + customs + util + primary + logistics;

    document.getElementById("result").innerText =
`📊 РАСЧЁТ ПО АВТОМОБИЛЮ

💰 Растаможка:
(пошлина ${money(customs)} ₸ + утиль ${money(util)} ₸)

= ${money(customs_total)} ₸

🚗 Стоимость автомобиля:
${money(car_price)} ₸

📄 Первичная регистрация:
${money(primary)} ₸

🚚 Логистика:
${money(logistics)} ₸

━━━━━━━━━━━━━━━

🔥 ИТОГО ПОД КЛЮЧ:
${money(total)} ₸`;
}

function copyResult(){

    let text = document.getElementById("result").innerText;

    if(!text){
        alert("Сначала выполните расчет");
        return;
    }

    navigator.clipboard.writeText(text);

    alert("Расчет скопирован");
}

</script>

</body>
</html>
